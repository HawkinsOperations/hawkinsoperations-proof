name: proof-authority-integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  proof-authority-integrity:
    runs-on: ubuntu-latest
    env:
      DETECTIONS_AUTHORITY_SHA: eb8d39428c2aa2925db8350ebf586a82a6d109ee
      VALIDATION_AUTHORITY_SHA: acda60147222a8aae8f45d799beb21b7024f31c2
      PLATFORM_FIXTURE_SHA: 0c9fa3654db8691c0730a5ddd1e74a343c62c3a2
    steps:
      - name: Check out proof PR source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: hawkinsoperations-proof
          persist-credentials: false
      - name: Check out detection authority source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: HawkinsOperations/hawkinsoperations-detections
          ref: ${{ env.DETECTIONS_AUTHORITY_SHA }}
          path: hawkinsoperations-detections
          fetch-depth: 0
          persist-credentials: false
      - name: Check out validation authority source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: HawkinsOperations/hawkinsoperations-validation
          ref: ${{ env.VALIDATION_AUTHORITY_SHA }}
          path: hawkinsoperations-validation
          fetch-depth: 0
          persist-credentials: false
      - name: Check out platform test-fixture source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: HawkinsOperations/hawkinsoperations-platform
          ref: ${{ env.PLATFORM_FIXTURE_SHA }}
          path: hawkinsoperations-platform
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact immutable sibling revisions
        run: |
          test "$(git -C hawkinsoperations-detections rev-parse HEAD)" = "$DETECTIONS_AUTHORITY_SHA"
          test "$(git -C hawkinsoperations-validation rev-parse HEAD)" = "$VALIDATION_AUTHORITY_SHA"
          test "$(git -C hawkinsoperations-platform rev-parse HEAD)" = "$PLATFORM_FIXTURE_SHA"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install declared proof verifier dependencies
        working-directory: hawkinsoperations-proof
        run: python -m pip install PyYAML==6.0.2 pytest==8.3.5
      - name: Reject retired fixture vocabulary
        working-directory: hawkinsoperations-proof
        run: |
          python - <<'PY'
          import subprocess
          import unicodedata
          from pathlib import PurePosixPath

          retired = "".join(("syn", "thetic"))
          binary_extensions = frozenset({
              ".7z", ".avif", ".avi", ".bz2", ".dll", ".dylib", ".eot", ".exe", ".gif",
              ".gz", ".ico", ".jpeg", ".jpg", ".mov", ".mp3", ".mp4", ".pdf",
              ".png", ".pyc", ".so", ".tar", ".tgz", ".ttf", ".wasm", ".webp",
              ".woff", ".woff2", ".xz", ".zip",
          })
          paths = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              capture_output=True,
          ).stdout.decode("utf-8").split("\0")
          findings = []
          for relative in filter(None, paths):
              if retired in unicodedata.normalize("NFKC", relative).casefold():
                  findings.append(f"tracked filename: {relative}")
              if PurePosixPath(relative).suffix.casefold() in binary_extensions:
                  continue
              blob = subprocess.run(
                  ["git", "show", f":{relative}"],
                  check=True,
                  capture_output=True,
              ).stdout
              if b"\0" in blob:
                  findings.append(f"tracked non-binary content contains NUL: {relative}")
                  continue
              try:
                  text = blob.decode("utf-8")
              except UnicodeDecodeError:
                  findings.append(f"tracked non-binary content is not UTF-8: {relative}")
                  continue
              if retired in unicodedata.normalize("NFKC", text).casefold():
                  findings.append(f"tracked content: {relative}")
          if findings:
              raise SystemExit(
                  "retired fixture vocabulary found:\n- " + "\n- ".join(findings)
              )
          PY
      - name: Verify proof status index and reverse inventory
        working-directory: hawkinsoperations-proof
        run: python -B scripts/verify_detection_proof_status_index.py
      - name: Verify independent proof integrity
        working-directory: hawkinsoperations-proof
        run: python -B scripts/verify_proof_integrity.py
      - name: Run hostile and parity unit tests
        working-directory: hawkinsoperations-proof
        run: python -B -m unittest discover -s tests
      - name: Run proof pytest suite
        working-directory: hawkinsoperations-proof
        run: python -B -m pytest
      - name: Reject whitespace errors
        working-directory: hawkinsoperations-proof
        run: git diff --check
